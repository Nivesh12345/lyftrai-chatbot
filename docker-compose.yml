services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      LLM_API_KEYS: ${LLM_API_KEYS:?set LLM_API_KEYS in .env (comma-separated, at least 2 keys)}
      LLM_MODEL: ${LLM_MODEL:-gemini/gemini-3.5-flash-lite}
      LLM_MODELS: ${LLM_MODELS:-gemini/gemini-3.5-flash-lite,gemini/gemini-3.8-flash,gemini/gemini-3.1-flash-lite}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/app.db}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      ENABLE_FAILURE_SIMULATION: ${ENABLE_FAILURE_SIMULATION:-true}
      CACHE_TYPE: ${CACHE_TYPE:-disk}
      CACHE_DIR: ${CACHE_DIR:-/data/llm_cache}
    volumes:
      - appdata:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  appdata:
